[project]
name = "bird"
version = "0.1.0"
description = "Play with bird detection and recognition"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["opencv-python>=4.13"]

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["scripts"]
